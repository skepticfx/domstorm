<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151614">
    <meta name="description" content="DOM Lab catalogs and runs browser behavior experiments at the edge.">

  </head>
  <body>

    <header class="topbar">

        <span>
          <strong>DOM Lab</strong>
          <small>browser behavior experiments</small>
        </span>

        <a href="/new" data-nav="new">New</a>
